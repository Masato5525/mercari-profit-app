<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8">
<title>フリマ利益計算</title>
<link rel="manifest" href="manifest.json">

<style>
body {
  font-family: Arial;
  padding: 10px;
  max-width: 500px;
  margin: auto;
}

.market-buttons {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}

.market-buttons button {
  flex: 1;
  padding: 12px;
  font-size: 16px;
}

input {
  width: 100%;
  padding: 8px;
  margin: 8px 0;
}

.result {
  margin-top: 20px;
  font-weight: bold;
  font-size: 16px;
}

.profit-value {
  font-size: 24px;
  font-weight: bold;
}

.profit-plus {
  color: green;
}

.profit-minus {
  color: red;
}

.history {
  margin-top: 20px;
  padding: 10px;
  background: #f0f0f0;
  font-size: 14px;
}

.shipping-table {
  margin-top: 20px;
  font-size: 14px;
  background: #f5f5f5;
  padding: 10px;
  width: 100%;
  box-sizing: border-box;
}

input {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
  font-size: 16px;
  box-sizing: border-box;
}

.fee-info {
  font-size: 14px;
  color: #666;
  margin-top: 4px;
}

button {
  width: 100%;
  padding: 18px;
  font-size: 20px;
  font-weight: bold;
  margin-top: 15px;
  background: #4CAF50;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

button:active {
  transform: scale(0.97);
}
</style>
</head>

<body>

<h2>フリマ利益計算</h2>

<div class="market-buttons">

<button onclick="setMarket('mercari')">メルカリ</button>
<button onclick="setMarket('rakuma')">ラクマ</button>
<button onclick="setMarket('yahoo')">Yahoo</button>

</div>

<label>仕入れ価格</label>
<input type="number" id="cost">

<label>販売価格</label>
<input type="number" id="price" inputmode="decimal">

<label>送料</label>
<input type="number" id="shipping">

<div class="fee-info"> ※ メルカリ販売手数料：10％</div>

<div class="result" id="output"></div>

<label>コメント<label>
<input type="text" id="comment" placeholder="商品名">
<button onclick="saveCurrent()">保存</button>

<div class="shipping-table">
<b>📦 ヤマト（らくらくメルカリ便）</b><br>
ネコポス: 210円<br>
宅急便コンパクト: 450円<br>
60サイズ: 750円<br>
80サイズ: 850円<br><br>

<b>📮 日本郵便（ゆうゆうメルカリ便）</b><br>
ゆうパケットポスト: 215円<br>
ゆうパケットプラス: 455円<br>
60サイズ: 770円<br>
80サイズ: 870円
</div>

<div class="history">
<b>📊 計算履歴（最新5件）</b>
<div id="historyList"></div>
</div>

<script>
//フリマ手数料設定
let feeRate = 0.10;
let marketName = "メルカリ";

function setMarket(market) {
  if(market === 'mercari'){
    feeRate = 0.10;
    marketName = "メルカリ";
  } else if(market === 'rakuma'){
    feeRate = 0.10; // 販売回数によって変動するのでとりあえず10％で設定
    marketName = "ラクマ";
  } else if(market === 'yahoo'){
    feeRate = 0.05;
    marketName = "Yahoo";
  }
  calculate(); // 市場を切り替えたら再計算
}

// DOM要素の取得
const costInput = document.getElementById("cost");
const priceInput = document.getElementById("price");
const shippingInput = document.getElementById("shipping");
const output = document.getElementById("output");
const historyList = document.getElementById("historyList");

// 利益を計算して表示する関数
function calculate() {
  // 入力値を取得
  const cost = Number(costInput.value);
  const price = Number(priceInput.value);
  const shipping = Number(shippingInput.value);

  // 販売価格が入力されていない場合は何も表示しない
  if (!price) {
    output.innerHTML = "";
    return;
  }

  // 手数料を計算（手数料はボタンによって変動するので変数を呼び出す）
  const fee = price * feeRate;
  // 利益を計算（販売価格 - 手数料 - 仕入れ価格 - 送料）
  const profit = price - fee - cost - shipping;
  // 利益率を計算
  const rate = (profit / price) * 100;

  // 利益がプラスかマイナスかでクラスを決定
  const profitClass = profit >= 0 ? "profit-plus" : "profit-minus";

  // 結果を表示
  output.innerHTML =
    "<div>利益: <span class='profit-value " + profitClass + "'>"
      + Math.round(profit) + "円</span></div>" +
    "<div>手数料: " + Math.round(fee) + "円</div>" +
    "<div>利益率: " + rate.toFixed(1) + "%</div>";

  // 履歴に保存(自動保存を一旦消す)
  //saveHistory(Math.round(profit), Math.round(fee), shipping, rate.toFixed(1));
}

//保存ボタンがクリックされたら現在の計算結果を履歴に保存する関数
function saveCurrent() {
  const cost = Number(costInput.value);
  const price = Number(priceInput.value);
  const shipping = Number(shippingInput.value);
  const comment = document.getElementById("comment").value;

  if (!price) return; // 販売価格が入力されていない場合は保存しない

  const fee = price * feeRate;
  const profit = price - fee - cost - shipping;
  const rate = (profit / price) * 100;

  //localStorageから過去の履歴を取得（なければ空配列）
  let history = JSON.parse(localStorage.getItem("profitHistory")) || [];

  //新しい履歴を先頭に追加
  history.unshift({
    profit: Math.round(profit),
    fee: Math.round(fee),
    shipping: shipping,
    rate: rate.toFixed(1),
    comment: comment
  });

  //履歴が5件超えたら古いデータを削除
  if (history.length > 5) {
    history.pop();
  }

  //更新した履歴データをlocalStorageに保存
  localStorage.setItem("profitHistory", JSON.stringify(history));

  //履歴表示を更新
  renderHistory();

  document.getElementById("comment").value = ""; // コメント入力をクリア
  }

// // 計算履歴を保存する関数
//function saveHistory(profit, fee, shipping, rate) {
  // // localStorageから履歴を取得（なければ空配列）
  //let history = JSON.parse(localStorage.getItem("profitHistory")) || [];

  // // 新しい履歴を先頭に追加
  //history.unshift({
    //profit: profit,
    // fee: fee,
    // shipping: shipping,
    // rate: rate
  //});

  // // 履歴を5件以内に制限
  // if (history.length > 5) {
  //   history.pop();
  // }

  // // localStorageに保存
  // localStorage.setItem("profitHistory", JSON.stringify(history));
  // // 履歴を表示
  // renderHistory();
//}

// 履歴を表示する関数
function renderHistory() {
  // localStorageから履歴を取得
  let history = JSON.parse(localStorage.getItem("profitHistory")) || [];

  // 履歴リストをクリア
  historyList.innerHTML = "";

  // 各履歴項目を表示
  history.forEach(item => {
    historyList.innerHTML += `
      <div>
        利益: ${item.profit}円 / 手数料: ${item.fee}円 /
        送料: ${item.shipping}円 / 利益率: ${item.rate}%
      </div>
      <div>コメント: ${item.comment || ""}</div>
      <hr>
    `;
  });
}

// 入力フィールドにイベントリスナーを追加（入力時に計算を実行）
costInput.addEventListener("input", calculate);
priceInput.addEventListener("input", calculate);
shippingInput.addEventListener("input", calculate);

// ページ読み込み時に履歴を表示
renderHistory();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>


</body>
</html>
